{% extends 'base.html' %}

{% block title %}
    <title>Add Comment Form</title>
{% endblock %}

{% block body %}

        {% csrf_token %}
        <input type="text" name="title" placeholder="Title">
        <input type="text" name="body" placeholder="Body">
        <button type="submit">Add Comment</button>
    </form>
{% endblock %}
