{% load static %}

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>All Blog Joker - {% block title %} {% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'styles.css' %}" type="text/css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg" style="background-color: #121212;">
      <div class="container-fluid">
          <a class="navbar-brand text-white fw-bold" href="{% url 'homepage' %}">All Blog Joker</a>
          <button class="navbar-toggler text-white" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" 
              aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
              <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
              <ul class="navbar-nav ms-auto">
                  <li class="nav-item">
                      <a class="nav-link text-white fw-bold" href="{% url 'homepage' %}">Homepage</a>
                  </li>
                  {% if user.is_authenticated %}
                  <li class="nav-item">
                      <a class="nav-link text-white fw-bold" href="{% url 'logout_user' %}">Logout</a>
                  </li>
                  {% else %}
                  <li class="nav-item">
                      <a class="nav-link text-white fw-bold" href="{% url 'register_user' %}">Register</a>
                  </li>
                  <li class="nav-item">
                      <a class="nav-link text-white fw-bold" href="{% url 'login_user' %}">Login</a>
                  </li>
                  {% endif %}
              </ul>
          </div>
      </div>
    </nav>
    {% block body %} {% endblock %}
  </body>
</html>
